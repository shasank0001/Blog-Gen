name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: blog_gen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d blog_gen_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SECRET_KEY: ci-only-not-a-deployment-secret-0123456789
      DATABASE_URL: postgresql+asyncpg://test:test-only-password@localhost:5432/blog_gen_test
      BLOG_GEN_TEST_DATABASE_URL: postgresql+asyncpg://test:test-only-password@localhost:5432/blog_gen_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -c backend/pytest.ini backend/tests -q

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./deploy.sh init
      - run: ./deploy.sh up
      - run: |
          curl --fail http://localhost:8080/health/ready
          curl --fail http://localhost:8080/api/v1/auth/config
          curl --fail http://localhost:8080/drafts/example -o /dev/null
      - if: failure()
        run: docker compose --env-file .env.production -p blog-gen-production -f compose.production.yml logs --tail=100
      - if: always()
        run: ./deploy.sh down
