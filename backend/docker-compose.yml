services:
  db:
    image: postgres:15
    container_name: blog_gen_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog_gen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d blog_gen"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
